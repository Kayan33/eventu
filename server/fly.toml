# fly.toml app configuration file generated for eventkt-api on 2026-08-07T22:53:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eventkt-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/docs'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
