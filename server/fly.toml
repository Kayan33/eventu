app = "eventkt-api"
primary_region = "gru"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/docs"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
